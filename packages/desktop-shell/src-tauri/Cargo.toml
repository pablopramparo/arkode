[package]
name = "app"
version = "0.4.7"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
# Adding the arkode-scheduler [[bin]] below made the crate have two binaries
# (this + the implicit src/main.rs); cargo/tauri then can't tell which is
# "the app". src/main.rs is bin `app`.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Windows service that runs scheduled backups (src/bin/scheduler.rs).
# Built separately from `tauri build` via scripts/prepare-scheduler.mjs and
# bundled as resources/scheduler/arkode-scheduler.exe. See CLAUDE.md's
# "Scheduler" section.
[[bin]]
name = "arkode-scheduler"
path = "src/bin/scheduler.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync", "time"] }
# Triggers one Windows UAC elevation prompt for a single command (ShellExecuteW
# with the "runas" verb under the hood) -- used only by register_task_schedule,
# so a user can register a task's Windows Scheduled Task from the app itself
# without the whole app needing to run elevated all the time.
runas = "1"
# The arkode-scheduler service binary only (src/bin/scheduler.rs). Thin
# wrapper over the Windows Service Control Manager; pulls the `windows`
# crate transitively.
windows-service = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
