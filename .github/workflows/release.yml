name: Release

# Triggered by pushing a tag like v0.1.5 — mirrors the manual release process
# documented in CLAUDE.md's "Packaging" section exactly (bump version in
# tauri.conf.json + Cargo.toml, build+sign, publish an installer + latest.json
# GitHub Release), just automated and reproducible on a clean runner instead
# of this one dev machine. workflow_dispatch exists only for a manual re-run
# of an already-tagged version (e.g. after fixing a build issue), not for
# publishing untagged/arbitrary builds.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)build and publish, e.g. v0.1.5"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    # Pinned, not windows-latest: that image moved to a Visual Studio
    # version node-gyp's VS-finder doesn't recognize yet ("unknown version
    # 'undefined' found at C:\Program Files\Microsoft Visual Studio\18\..."),
    # which broke better-sqlite3's native build — confirmed 2026-08-25 on a
    # real run. windows-2022 is the same VS2022 toolchain this app is built
    # with on the actual dev machine.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag/version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches tauri.conf.json / Cargo.toml version
        shell: bash
        run: |
          CONF_VERSION=$(node -p "require('./packages/desktop-shell/src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep -m1 '^version' packages/desktop-shell/src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Tag version: ${{ steps.version.outputs.version }}"
          echo "tauri.conf.json version: $CONF_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$CONF_VERSION" != "${{ steps.version.outputs.version }}" ] || [ "$CARGO_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match the version bumped in tauri.conf.json/Cargo.toml. Bump both files and re-tag."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop-shell/src-tauri

      - name: Cache vendored PostgreSQL client tools
        uses: actions/cache@v4
        with:
          path: packages/desktop-shell/.build-cache
          key: pgsql-tools-${{ hashFiles('packages/desktop-shell/scripts/prepare-pg-tools.mjs') }}

      - name: Cache vendored restic binary
        uses: actions/cache@v4
        with:
          path: packages/desktop-shell/.build-cache
          key: restic-tool-${{ hashFiles('packages/desktop-shell/scripts/prepare-restic.mjs') }}

      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-${{ hashFiles('packages/engine-cli/package.json') }}

      - run: pnpm install --frozen-lockfile

      # Vendors the real Windows restic.exe (see prepare-restic.mjs) here,
      # ahead of the release gate below, so the real-restic-gated
      # file-backup tests actually run instead of self-skipping for lack of
      # RESTIC_PATH -- previously true even on this Windows job, since
      # nothing set it. The later "Build signed installer" step's own
      # beforeBuildCommand still calls prepare-restic again, harmlessly --
      # confirmed idempotent (it just reuses this same cache).
      - name: Vendor restic (also needed for the release-gate tests below)
        run: pnpm --filter desktop-shell prepare-restic

      - name: Run engine-core tests (release gate)
        env:
          RESTIC_PATH: ${{ github.workspace }}\packages\desktop-shell\src-tauri\resources\restic\restic.exe
        run: |
          pnpm --filter engine-core build
          pnpm --filter engine-cli build
          pnpm --filter engine-core test

      - name: Build signed installer
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter desktop-shell build

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          git tag -l --format='%(contents)' "${{ steps.version.outputs.tag }}" > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release ${{ steps.version.outputs.tag }}" > "$NOTES_FILE"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        id: manifest
        shell: bash
        env:
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          BUNDLE_DIR="packages/desktop-shell/src-tauri/target/release/bundle/nsis"
          SETUP_EXE="arkode_${{ steps.version.outputs.version }}_x64-setup.exe"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          node -e "
            const fs = require('node:fs');
            const notes = fs.readFileSync(process.env.NOTES_FILE, 'utf8').trim();
            const manifest = {
              version: '${{ steps.version.outputs.version }}',
              notes,
              pub_date: '$PUB_DATE',
              platforms: {
                'windows-x86_64': {
                  signature: fs.readFileSync('$BUNDLE_DIR/$SETUP_EXE.sig', 'utf8').trim(),
                  url: 'https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/$SETUP_EXE',
                },
              },
            };
            fs.writeFileSync('$BUNDLE_DIR/latest.json', JSON.stringify(manifest, null, 2));
          "
          echo "bundle_dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"
          echo "setup_exe=$SETUP_EXE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.manifest.outputs.bundle_dir }}/${{ steps.manifest.outputs.setup_exe }}" \
            "${{ steps.manifest.outputs.bundle_dir }}/latest.json" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            --latest
