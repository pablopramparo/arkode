name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  engine-core:
    # windows-2022, not ubuntu: arkode is Windows-only, and the file-backup
    # domain's code enforces absolute Windows paths (fileBackupTasksRepo's
    # createLocalFolder, restic/paths.ts's toResticPath) — the real-restic
    # test suites literally cannot pass on Linux, where the temp dir is
    # /tmp/... Pinned to 2022 for the same reason release.yml is (newer
    # images moved to a VS version node-gyp's finder doesn't recognise,
    # breaking better-sqlite3's native build).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache vendored restic binary
        uses: actions/cache@v4
        with:
          path: packages/desktop-shell/.build-cache
          key: restic-tool-${{ hashFiles('packages/desktop-shell/scripts/prepare-restic.mjs') }}

      - run: pnpm install --frozen-lockfile

      # Vendors the real Windows restic.exe so the real-restic-gated
      # file-backup suites (test/fileBackup/**) actually run instead of
      # self-skipping — same step release.yml uses.
      - name: Vendor restic (for the real-restic-gated file-backup tests)
        run: pnpm --filter desktop-shell prepare-restic

      - name: Run engine-core tests
        env:
          RESTIC_PATH: ${{ github.workspace }}\packages\desktop-shell\src-tauri\resources\restic\restic.exe
        run: |
          pnpm --filter engine-core build
          pnpm --filter engine-cli build
          pnpm --filter engine-core test
